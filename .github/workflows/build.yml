name: Release

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  check:
    name: Check Rust project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check and test
        run: |
          cargo check --locked
          cargo test --locked

  build:
    name: Build ${{ matrix.arch }} binary
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        run: |
          strip target/release/zggsds
          tar -czf zggsds-${{ matrix.arch }}.tar.gz -C target/release zggsds

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zggsds-${{ matrix.arch }}
          path: zggsds-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  docker:
    name: Build and push Docker image
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: zggsds-*
          path: dist
          merge-multiple: true

      - name: Prepare image context
        run: |
          set -euo pipefail
          mkdir -p dist/data
          for arch in amd64 arm64; do
            mkdir -p "dist/linux/$arch"
            tar -xzf "dist/zggsds-$arch.tar.gz" -C "dist/linux/$arch" zggsds
            test -x "dist/linux/$arch/zggsds"
            file "dist/linux/$arch/zggsds"
          done

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: crpi-gz6f3ok0ezphywc8.cn-shanghai.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Compute image version
        id: meta
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: dist
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/42tr/zggsds:${{ steps.meta.outputs.version }}
            ghcr.io/42tr/zggsds:latest
            crpi-gz6f3ok0ezphywc8.cn-shanghai.personal.cr.aliyuncs.com/42tr/zggsds:${{ steps.meta.outputs.version }}
            crpi-gz6f3ok0ezphywc8.cn-shanghai.personal.cr.aliyuncs.com/42tr/zggsds:latest
          # 阿里云 ACR 个人版不支持 OCI provenance 工件。
          provenance: false
